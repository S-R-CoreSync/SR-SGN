name: مزامنة الأخبار المجدولة

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "اسم مصدر واحد فقط (اتركه فارغاً لمزامنة الكل)"
        required: false
        type: string
  # يعمل بعد كل نشر ناجح حتى تظهر البيانات الجديدة دون انتظار الدورة الساعية
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: مزامنة المصادر (كل مصدر بطلب منفصل)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY_SOURCE: ${{ inputs.source }}
        run: |
          set -u

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET غير مضبوط في أسرار المستودع (Settings → Secrets and variables → Actions)"
            exit 1
          fi

          ALL_SOURCES="sy-nl.org youtube facebook-sgn nos-netherlands euronews-europe euronews-business euronews-culture tweakers-tech nu-tech techcrunch-tech arstechnica-tech wired-tech"
          SOURCES="${ONLY_SOURCE:-$ALL_SOURCES}"

          failed=0
          for src in $SOURCES; do
            echo "── مزامنة المصدر: $src"
            code=000
            # دفعات صغيرة + ميزانية زمنية أقل من maxDuration على Vercel (60 ثانية).
            # 504 يعني أن الدالة قطعت قبل أن تنهي الترجمة — نعيد المحاولة مرة بعد تهدئة.
            for attempt in 1 2 3; do
              code=$(curl -sS -o "/tmp/sync-$src.json" -w "%{http_code}" --max-time 75 \
                -X POST "https://sgn-drab.vercel.app/api/sync" \
                -H "Content-Type: application/json" \
                -H "Cache-Control: no-cache" \
                -H "x-cron-secret: $CRON_SECRET" \
                -d "{\"source\":\"$src\",\"limit\":6,\"concurrency\":2,\"timeBudgetMs\":25000,\"autoCategorize\":false}") || code=000

              echo "  المحاولة $attempt: HTTP $code"
              if [ "$code" = "200" ]; then break; fi
              if [ "$code" != "504" ] && [ "$code" != "429" ] && [ "$code" != "000" ]; then break; fi
              sleep 10
            done

            head -c 600 "/tmp/sync-$src.json" 2>/dev/null || true
            echo

            if [ "$code" != "200" ]; then
              echo "::warning::المصدر $src رجع $code"
              failed=$((failed + 1))
            fi
            # تهدئة بين المصادر حتى لا نضرب مزوّد الذكاء الاصطناعي دفعة واحدة
            sleep 3
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::فشل $failed مصدر/مصادر"
            exit 1
          fi
          echo "تمّت مزامنة كل المصادر بنجاح"
