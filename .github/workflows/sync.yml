name: مزامنة الأخبار المجدولة

on:
  schedule:
    - cron: "0 * * * *"
    # تدقيق أسبوعي للتكرار (الأحد 03:00 UTC) — ضمن نفس جدول المزامنة
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: "اسم مصدر واحد فقط (اتركه فارغاً لمزامنة الكل)"
        required: false
        type: string
  # يعمل بعد كل نشر ناجح حتى تظهر البيانات الجديدة دون انتظار الدورة الساعية
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # أربع مجموعات متوازية (٣-٤ مصادر لكل مجموعة). التشغيل التسلسلي لكل المصادر
    # كان يصل إلى حدّ الـ ٢٥ دقيقة ويلغى قبل أن ينتهي.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: community
            sources: "sy-nl.org youtube facebook-sgn"
          - shard: nl-euronews
            sources: "nos-netherlands euronews-europe euronews-business"
          - shard: culture-tech-nl
            sources: "euronews-culture tweakers-tech nu-tech nu-sport"
          - shard: tech-world
            sources: "techcrunch-tech arstechnica-tech wired-tech"
    steps:
      - name: مزامنة المصادر
        if: github.event_name != 'workflow_dispatch' || inputs.source == '' || contains(matrix.sources, inputs.source)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SHARD: ${{ matrix.shard }}
          SELECTED_SOURCE: ${{ inputs.source }}
          SOURCES: ${{ matrix.sources }}
        run: |
          set -u

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET غير مضبوط في أسرار المستودع (Settings → Secrets and variables → Actions)"
            exit 1
          fi

          if [ -n "${SELECTED_SOURCE:-}" ]; then
            sources="$SELECTED_SOURCE"
          else
            sources="$SOURCES"
          fi

          failed=0
          quota_blocked=0
          source_failed=0
          for src in $sources; do
            echo "── [$SHARD] مزامنة المصدر: $src"
            code=000
            quota_hit=0
            # دفعات صغيرة + ميزانية زمنية أقل من maxDuration على Vercel (60 ثانية).
            # 504 يعني أن الدالة قطعت قبل أن تنهي الترجمة — نعيد المحاولة بعد تهدئة.
            for attempt in 1 2 3; do
              code=$(curl -sS -o "/tmp/sync-$src.json" -w "%{http_code}" --max-time 75 \
                -X POST "https://sgn-drab.vercel.app/api/sync" \
                -H "Content-Type: application/json" \
                -H "Cache-Control: no-cache" \
                -H "x-cron-secret: $CRON_SECRET" \
                -d "{\"source\":\"$src\",\"limit\":6,\"concurrency\":1,\"timeBudgetMs\":30000,\"autoCategorize\":false}") || code=000

              echo "  المحاولة $attempt: HTTP $code"
              if [ "$code" = "200" ]; then break; fi

              # نفاد حصة Groq اليومية (TPD): إعادة المحاولة بلا جدوى حتى إعادة التعيين.
              if [ "$code" = "429" ] && grep -q '"quotaExhausted":true' "/tmp/sync-$src.json" 2>/dev/null; then
                echo "::warning::حصة Groq اليومية مستنفدة — يتابع التشغيل التالي بعد إعادة التعيين"
                quota_hit=1
                quota_blocked=$((quota_blocked + 1))
                break
              fi
              if [ "$code" != "504" ] && [ "$code" != "429" ] && [ "$code" != "000" ]; then break; fi
              sleep 10
            done

            head -c 600 "/tmp/sync-$src.json" 2>/dev/null || true
            echo

            if [ "$code" != "200" ] && [ "$quota_hit" -eq 0 ]; then
              echo "::warning::المصدر $src رجع $code"
              failed=$((failed + 1))
            fi

            # 🚨 HTTP 200 لا يعني نجاح المصدر: /api/sync يُرجِع success:false داخل
            # results عند فشل مصدر (مثل توكن فيسبوك المنتهي). كنا نعدّه نجاحاً بصمت.
            if [ "$code" = "200" ] && grep -q '"success":false' "/tmp/sync-$src.json" 2>/dev/null; then
              echo "::warning::المصدر $src رجع HTTP 200 لكن success=false — راجع errors في الاستجابة"
              source_failed=$((source_failed + 1))
            fi
            sleep 3
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::فشل $failed مصدر/مصادر في المجموعة $SHARD"
            exit 1
          fi
          echo "تمّت مزامنة مجموعة $SHARD (حصة مستنفدة: $quota_blocked، مصادر فاشلة داخلياً: $source_failed)"

  # تدقيق أسبوعي: يفحص الهوية الثابتة والصور المشتركة ويكتب التقرير في Summary.
  # أي مشكلة تُظهر ::error:: فتصل تنبيهات GitHub دون إرسال أسرار أو بريد خارجي.
  audit-dedup:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4
      - name: إعداد Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: تدقيق التكرار
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/23-audit-duplicates.mjs
