# ============================================================
# 🔄 سير العمل الموحّد للتحقق من الجودة (CI)
# ------------------------------------------------------------
# ملاحظة: النشر إلى الإنتاج يتم تلقائياً عبر تكامل Vercel مع Git
# (كل push إلى main يُطلق نشراً جديداً على رابط الزبون).
# هذا السير مسؤول فقط عن التحقق: الأنواع، ESLint، i18n، الاختبارات، والبناء.
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# أقل صلاحيات ممكنة (قراءة المستودع فقط)
permissions:
  contents: read

# إلغاء التشغيلات القديمة عند دفع جديد على نفس الفرع
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DATABASE_URL: "file:./prisma/test.db"
  NEXTAUTH_SECRET: "test-secret-key-for-ci"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  # ── ١) التحقق من الجودة: الأنواع + ESLint + i18n + الاختبارات ──
  quality:
    name: Typecheck • Lint • i18n • Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: تثبيت الحزم
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps --force

      - name: توليد Prisma Client
        run: npx prisma generate

      - name: فحص الأنواع (TypeScript)
        run: npm run typecheck

      - name: فحص ESLint
        run: npm run lint

      - name: فحص النصوص العربية المباشرة (i18n)
        run: npm run i18n:check

      - name: تهيئة قاعدة بيانات الاختبار
        # ملاحظة: Prisma v7 أزال الخيار --skip-generate
        run: npx prisma db push --accept-data-loss

      - name: اختبارات الوحدة (Vitest)
        run: npm run test:run

  # ── ٢) بناء الإنتاج ──
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: تثبيت الحزم
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps --force

      - name: بناء المشروع
        run: npm run build
